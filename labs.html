<!DOCTYPE html>
<html lang="en" class="js-loading">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>labs — lluc.dev</title>
<link rel="stylesheet" href="assets/content.css">
<link rel="icon" href="assets/favicon.png" type="image/png">
<style>html.js-loading body{opacity:0}</style>
<style>
  @font-face{font-family:'Myeongjo';src:url('assets/fonts/YES24MyoungjoRegular.ttf');font-weight:400;font-display:swap}
  @font-face{font-family:'Myeongjo';src:url('assets/fonts/YES24MyoungjoBold.ttf');font-weight:700;font-display:swap}
  body { max-width: none; margin: 0; padding: 0; }
  .page-nav { background: rgba(239,233,219,0.9); }

  .labs-wrap { max-width: min(75vw, 1500px); margin: 0 auto; padding: 3rlh 2rlh 5rlh; }
  @media (max-width: 768px) { .labs-wrap { max-width: none; padding: 2rlh 1rem 4rlh; } }

  .labs-head { margin-bottom: 3rlh; }
  .labs-kicker {
    font-size: .62rem; letter-spacing: .26em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 1rlh; display: inline-block;
    border-bottom: 4px solid transparent;
    padding-bottom: .4rlh;
  }
  .labs-head h1 { font-size: 2.6em; line-height: 1.1; margin: 0 0 1rlh; }
  @media (max-width: 768px) { .labs-head h1 { font-size: 2em; } }
  .labs-head p { color: var(--dim); max-width: 46ch; margin: 0; font-size: .92rem;
    font-family: 'Myeongjo', serif; }

  .labs-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1.4rlh;
  }
  @media (max-width: 900px) { .labs-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px)  { .labs-grid { grid-template-columns: 1fr; } }
  .lab {
    position: relative; display: block; border: 1px solid transparent;
    padding: 2rlh 1.6rlh; min-height: 12rlh; background: rgba(255,255,255,.14);
    transition: background .25s, transform .25s, box-shadow .25s;
  }
  a.lab:hover { opacity: 1; background: rgba(255,255,255,.4); transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  .lab-num { font-size: .6rem; letter-spacing: .18em; color: var(--dim); }
  .lab-title { font-size: 1.5em; line-height: 1.1; margin: .5rlh 0 .35rlh; display: block; }
  .lab-desc { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .lab-soon {
    position: absolute; top: 1.2rlh; right: 1.1lh;
    font-size: .54rem; letter-spacing: .2em; text-transform: uppercase;
    color: #8a6d00; background: repeating-linear-gradient(45deg,#f3e08a 0 6px,#e8c200 6px 12px);
    padding: 2px 7px; border-radius: 2px;
  }
  .lab.dead { cursor: default; opacity: .72; border-style: dashed; }
  .lab.dead:hover { transform: none; box-shadow: none; background: rgba(255,255,255,.14); }

  .labs-foot { margin-top: 3rlh; font-size: .78rem; color: var(--dim); }
  .labs-foot a { border-bottom: 1px solid currentColor; }

  .gc { display: inline-block; width: 1.75ch; text-align: center; white-space: pre; letter-spacing: 0; }
</style>
</head>
<body>

<nav class="page-nav">
  <div class="nav-inner">
    <span class="nav-left">
      <a class="nav-logo-link" href="/"><img src="assets/lluc.png" class="nav-logo" alt=""></a>
      <a href="/">lluc.dev</a>
      <span class="nav-dim"> · </span>
      <span class="nav-dim">labs</span>
    </span>
    <span class="nav-hint">⌨ esc</span>
  </div>
</nav>

<main class="labs-wrap">
  <div class="labs-grid">
    <a class="lab" href="labs/englglyph">
      <span class="lab-num">01</span>
      <span class="lab-title">glyphs</span>
      <span class="lab-desc">syllable blocks</span>
    </a>
    <a class="lab" href="labs/cassette">
      <span class="lab-num">02</span>
      <span class="lab-title">cassette</span>
      <span class="lab-desc">stylish covers</span>
    </a>
    <a class="lab" href="labs/yong">
      <span class="lab-num">03</span>
      <span class="lab-title">용</span>
      <span class="lab-desc">cursor trail</span>
    </a>
    <a class="lab" href="labs/insta">
      <span class="lab-num">04</span>
      <span class="lab-title">insta</span>
      <span class="lab-desc">post generator</span>
    </a>
  </div>

  <p class="labs-foot">return to <a href="/">lluc.dev</a></p>
</main>

<script src="assets/nav.js"></script>
<script>
(function(){
  var p = document.getElementById('labs-desc');
  if (p) {
    p.innerHTML = [...p.textContent].map(function(ch) {
      return '<span class="gc">' + ch + '</span>';
    }).join('');
  }
})();
</script>
</body>
</html>
