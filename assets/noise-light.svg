<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <filter id="paper-texture-light">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.05" intercept="-0.01"/>
      <feFuncG type="linear" slope="1.05" intercept="-0.01"/>
      <feFuncB type="linear" slope="1.05" intercept="-0.01"/>
    </feComponentTransfer>
    <feGaussianBlur stdDeviation="0.8"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#paper-texture-light)" opacity="0.06" fill="white"/>
</svg>
